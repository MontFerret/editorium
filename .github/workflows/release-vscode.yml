name: Release VS Code extension

on:
  push:
    tags:
      - 'vscode/v*'

permissions:
  contents: read

concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      title: ${{ steps.metadata.outputs.title }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Validate release tag
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: go -C tools/editorium run . release-ci metadata --tag "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"

  validate-and-package:
    needs: release-metadata
    uses: ./.github/workflows/vscode-validation.yml
    permissions:
      contents: read

  publish:
    needs:
      - release-metadata
      - validate-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Download validated VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ferret-vscode-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go -C tools/editorium run . release-ci check-assets --tag "$RELEASE_TAG" --directory release-assets

      - name: Inspect existing release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,assets 2>/dev/null)"; then
            action="$(go -C tools/editorium run . release-ci state --tag "$RELEASE_TAG" --release-json "$release_json")"
          else
            action=create
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Remove incomplete draft from an earlier attempt
        if: steps.release-state.outputs.action == 'replace-draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release delete "$RELEASE_TAG" --yes

      - name: Create GitHub Release
        if: steps.release-state.outputs.action != 'noop'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ needs.release-metadata.outputs.title }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
        shell: bash
        run: |
          release_flags=(
            --verify-tag
            --generate-notes
            --title "$RELEASE_TITLE"
            --latest=false
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/*.vsix "${release_flags[@]}"

      - name: Confirm matching published release
        if: steps.release-state.outputs.action == 'noop'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "GitHub Release $RELEASE_TAG already has the validated metadata and complete asset set."
