name: Release VS Code extension

on:
  push:
    tags:
      - 'vscode/v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable VS Code release tag, for example vscode/v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      marketplace_eligible: ${{ steps.metadata.outputs.marketplace_eligible }}
      title: ${{ steps.metadata.outputs.title }}

    steps:
      - name: Require Marketplace recovery from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/release-vscode.yml@refs/heads/main" ]]; then
            echo '::error::Dispatch Marketplace recovery from the release-vscode.yml workflow on main.'
            exit 1
          fi

      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Set up Go
        if: github.event_name == 'push'
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Validate release tag
        if: github.event_name == 'push'
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: go -C tools/editorium run . release-ci metadata --tag "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"

  validate-and-package:
    if: github.event_name == 'push'
    needs: release-metadata
    uses: ./.github/workflows/vscode-validation.yml
    permissions:
      contents: read

  github-release:
    if: github.event_name == 'push'
    needs:
      - release-metadata
      - validate-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Download validated VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ferret-vscode-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go -C tools/editorium run . release-ci check-assets --tag "$RELEASE_TAG" --directory release-assets

      - name: Inspect existing release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if release_json="$(gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,assets 2>/dev/null)"; then
            action="$(go -C tools/editorium run . release-ci state --tag "$RELEASE_TAG" --release-json "$release_json")"
          else
            action=create
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Remove incomplete draft from an earlier attempt
        if: steps.release-state.outputs.action == 'replace-draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release delete "$RELEASE_TAG" --yes

      - name: Create GitHub Release
        if: steps.release-state.outputs.action != 'noop'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ needs.release-metadata.outputs.title }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
        shell: bash
        run: |
          release_flags=(
            --verify-tag
            --generate-notes
            --title "$RELEASE_TITLE"
            --latest=false
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/*.vsix "${release_flags[@]}"

      - name: Confirm matching published release
        if: steps.release-state.outputs.action == 'noop'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "GitHub Release $RELEASE_TAG already has the validated metadata and complete asset set."

      - name: Explain Marketplace skip
        if: needs.release-metadata.outputs.marketplace_eligible != 'true'
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: echo "VS Code Marketplace requires an exact major.minor.patch version; $RELEASE_VERSION remains a GitHub Release only."

  publish-marketplace:
    needs:
      - release-metadata
      - github-release
    if: >-
      !cancelled() && needs.release-metadata.result == 'success' &&
      ((github.event_name == 'push' && needs.github-release.result == 'success' &&
      needs.release-metadata.outputs.marketplace_eligible == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.github-release.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Download validated VSIX artifacts
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: ferret-vscode-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete Marketplace package set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            args+=(--download)
          fi
          go -C tools/editorium run . release-ci vscode-marketplace-assets --tag "$RELEASE_TAG" --directory release-assets "${args[@]}"

      - name: Install publishing tool
        working-directory: extensions/vscode
        run: npm ci

      - name: Publish VSIXs with Marketplace Trusted Publishing
        env:
          LC_ALL: C
        shell: bash
        run: |
          node extensions/vscode/node_modules/@vscode/vsce/vsce publish \
            --oidc \
            --skip-duplicate \
            --packagePath release-assets/*.vsix
