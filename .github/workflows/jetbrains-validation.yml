name: JetBrains validation

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/jetbrains-validation.yml'
      - 'Makefile'
      - 'ferretd.json'
      - 'extensions/jetbrains/**'
      - 'shared/**'
      - 'tools/editorium/**'
      - '!tools/editorium/vscode.go'
      - '!tools/editorium/vscode_test.go'
  pull_request:
    paths:
      - '.github/workflows/jetbrains-validation.yml'
      - 'Makefile'
      - 'ferretd.json'
      - 'extensions/jetbrains/**'
      - 'shared/**'
      - 'tools/editorium/**'
      - '!tools/editorium/vscode.go'
      - '!tools/editorium/vscode_test.go'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Set up Make
        if: runner.os == 'Windows'
        run: choco install make --no-progress --yes

      - name: Test plugin and pinned daemon
        run: make test jetbrains

  package:
    name: Build, verify, and package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Build plugin
        run: make build jetbrains

      - name: Lint plugin
        run: make lint jetbrains

      - name: Package plugin
        run: make package jetbrains

      - name: Recheck package contents
        run: make package-check jetbrains
