name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Install ferretd integration-test release
        env:
          FERRETD_VERSION: v2.0.0-alpha.1
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/MontFerret/ferretd/releases/download/${FERRETD_VERSION}/ferretd_checksums.txt"
          curl -fsSLO "https://github.com/MontFerret/ferretd/releases/download/${FERRETD_VERSION}/ferretd_linux_x86_64.tar.gz"
          grep ' ferretd_linux_x86_64.tar.gz$' ferretd_checksums.txt | sha256sum --check -
          mkdir ferretd-integration
          tar -xzf ferretd_linux_x86_64.tar.gz -C ferretd-integration
          echo "$RUNNER_TEMP/ferretd-integration" >> "$GITHUB_PATH"
          echo "FERRETD_TEST_PATH=$RUNNER_TEMP/ferretd-integration/ferretd" >> "$GITHUB_ENV"

      - name: Test packages
        run: xvfb-run -a npm test

      - name: Package extensions
        run: npm run package

      - name: Verify package contents
        run: npm run package:check

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ferret-vscode-vsix
          path: vscode/*.vsix
          if-no-files-found: error
