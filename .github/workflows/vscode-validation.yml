name: VS Code validation

on:
  push:
    branches:
      - '**'
    paths:
      - '.gitattributes'
      - '.github/workflows/vscode-validation.yml'
      - 'Makefile'
      - 'ferretd.json'
      - 'extensions/vscode/**'
      - 'shared/**'
      - 'tools/editorium/**'
      - '!tools/editorium/jetbrains.go'
      - '!tools/editorium/jetbrains_test.go'
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/vscode-validation.yml'
      - 'Makefile'
      - 'ferretd.json'
      - 'extensions/vscode/**'
      - 'shared/**'
      - 'tools/editorium/**'
      - '!tools/editorium/jetbrains.go'
      - '!tools/editorium/jetbrains_test.go'
  workflow_call:

permissions:
  contents: read

jobs:
  distribution-targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Generate distribution matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(go -C tools/editorium run . matrix vscode)" >> "$GITHUB_OUTPUT"

  editor-packages:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Install dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Build packages
        run: make build vscode

      - name: Lint packages
        run: make lint vscode

      - name: Test packages
        run: xvfb-run -a make test vscode

  vscode-distributions:
    needs:
      - distribution-targets
      - editor-packages
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.distribution-targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/editorium/go.mod
          cache-dependency-path: tools/editorium/go.sum

      - name: Install dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Package target VSIX
        env:
          TARGET: ${{ matrix.target }}
        run: go -C tools/editorium run . package vscode

      - name: Recheck package contents
        env:
          TARGET: ${{ matrix.target }}
        run: go -C tools/editorium run . package-check vscode

      - name: Smoke daemon execution transport
        run: node extensions/vscode/scripts/daemon-smoke.mjs

      - name: Download stable VS Code for the installed test
        if: matrix.target == 'linux-x64'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 --max-time 60 https://update.code.visualstudio.com/api/update/linux-x64/stable/latest -o vscode-release.json
          url=$(jq -er '.url' vscode-release.json)
          curl -fsSL --proto '=https' --retry 3 --max-time 180 "$url" -o vscode.tar.gz
          jq -er '.sha256hash + "  vscode.tar.gz"' vscode-release.json | sha256sum -c -
          tar -xzf vscode.tar.gz

      - name: Test installed Linux x64 VSIX
        if: matrix.target == 'linux-x64'
        env:
          TARGET: ${{ matrix.target }}
          VSCODE_TEST_EXECUTABLE_PATH: ${{ runner.temp }}/VSCode-linux-x64/code
        run: xvfb-run -a go -C tools/editorium run . test-installed vscode

      - name: Upload target VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ferret-vscode-${{ matrix.target }}
          path: extensions/vscode/dist/ferret-vscode-*-${{ matrix.target }}.vsix
          if-no-files-found: error
